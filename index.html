<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ワードネーム／ニゴアマリ</title>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#10192e; --panel:#1b2742; --panel2:#24324f; --text:#f4f6fb; --muted:#9aa6c0;
  --accent:#ffcc33; --green:#1e9b53; --clear:#ffd23f; --neutral:#7b8495; --danger:#e5484d; --ok:#3ccf7a;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:none;border-radius:10px;padding:10px 18px;background:#3a4a6b;color:#fff;font-weight:700}
button:hover{filter:brightness(1.1)}
button.primary{background:var(--accent);color:#1a1a1a}
button.danger{background:var(--danger)}
button.ghost{background:transparent;border:1px solid #4a5a7c;color:var(--text)}
button.small{padding:6px 12px;font-size:13px;border-radius:8px}
button:disabled{background:#4a4f5a !important;color:#9aa0aa !important;cursor:not-allowed;filter:none}
input[type=text],textarea{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #4a5a7c;background:#0d1526;color:var(--text);width:100%}
h1,h2,h3{margin:0 0 12px}
.muted{color:var(--muted)}
.page{max-width:1100px;margin:0 auto;padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.card{background:var(--panel);border-radius:14px;padding:16px;margin-bottom:14px}

/* ===== ヘッダー（メイン・管理） ===== */
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.topbar .title{font-size:22px;font-weight:900;letter-spacing:.05em}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#666}
.chip .dot.on{background:var(--ok)}
.chip .x{background:none;padding:0 2px;color:var(--muted);font-size:14px}
.side-tag{display:inline-block;background:var(--accent);color:#1a1a1a;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:900}

/* ===== 盤面 ===== */
.board{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.cell{position:relative;background:#fff;color:#1d1d1f;border-radius:10px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:800;line-height:1.15;word-break:break-all;user-select:none;-webkit-user-select:none;overflow:hidden;border:3px solid transparent}
.cell .w{display:block;word-break:keep-all;white-space:nowrap}
.cell.k-g{background:var(--green);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.cell.k-k{background:#000;color:#fff;border-color:#8a8a8a}
.cell.is-clear{border-color:var(--clear)}
.cell.is-clear:not(.k-g):not(.k-k){background:#fff1b8}
.cell.is-neutral:not(.k-g):not(.k-k){background:#d3d8e1;color:#3a3f48}
.cell .badge{position:absolute;left:0;right:0;bottom:0;font-weight:900;letter-spacing:.08em;text-shadow:none}
.badge.clear{background:var(--clear);color:#222}
.badge.neutral{background:var(--neutral);color:#fff}
.cell.clickable{cursor:pointer;transition:transform .08s}
.cell.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.cell.tappable{cursor:pointer}
.cell.tappable:active{transform:scale(.95)}

body.host .cell{aspect-ratio:16/9;padding:6px 8px 26px}
body.host .cell .badge{font-size:16px;padding:2px 0}
body.sub .board{gap:5px}
body.sub .cell{aspect-ratio:1/0.92;padding:2px 2px 14px;border-radius:7px;border-width:2px}
body.sub .cell .badge{font-size:10px;padding:1px 0}

/* ===== メイン：ステータス ===== */
.status-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.status-bar.five{grid-template-columns:repeat(5,1fr)}
#ng-timer.hurry{color:#ff7a59}
#ng-timer.timeup{color:#fff}
.hard-mode.on{border:2px solid var(--danger);background:#3a1a1f}
.role-row{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.role-row .role-banner{flex:1;margin:0}
.wn-timer{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:84px;border-radius:10px;background:var(--panel);font-weight:900;color:var(--accent);font-variant-numeric:tabular-nums;line-height:1.05;padding:2px 6px}
.wn-timer small{font-size:11px;color:var(--muted)}
.wn-timer #ng-timer{font-size:28px}
.wn-timer #ng-timer.timeup{font-size:15px;color:#ff7a7a}
.stat{background:var(--panel);border-radius:12px;padding:10px 14px;text-align:center}
.stat .lbl{font-size:13px;color:var(--muted);font-weight:700}
.stat .val{font-size:30px;font-weight:900}
.stat .val small{font-size:16px;color:var(--muted)}
.stat.big .val{color:var(--accent)}
.lobby{display:flex;gap:28px;align-items:center;justify-content:center;flex-wrap:wrap;padding:20px 0}
.qrbox{display:inline-block;background:#fff;padding:14px;border-radius:12px;line-height:0}
.url{word-break:break-all;font-size:14px;color:var(--muted);margin-top:8px}
.slots{display:flex;flex-direction:column;gap:12px;min-width:300px}
.slot{background:var(--panel);border-radius:12px;padding:14px 16px;font-size:20px;font-weight:800;display:flex;align-items:center;gap:10px}
.slot.empty{color:var(--muted);font-weight:600;border:2px dashed #3a4a6b;background:transparent}
.result-banner{text-align:center;border-radius:14px;padding:18px;margin-bottom:14px}
.result-banner.clear{background:linear-gradient(135deg,#1e9b53,#3ccf7a)}
.result-banner.fail{background:linear-gradient(135deg,#5a1a1d,#a3262b)}
.result-banner .big{font-size:40px;font-weight:900}
body.sub .result-banner .big{font-size:26px}
.note{background:#2c2410;border:1px solid #6b5520;color:#ffe9a8;border-radius:10px;padding:10px 14px;margin-bottom:12px}

/* ===== サブ ===== */
body.sub .page{max-width:520px;padding:10px}
.sub-head{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:8px}
.role-banner{border-radius:10px;padding:8px 10px;text-align:center;font-size:18px;font-weight:900;margin-bottom:8px}
.role-banner.giver{background:var(--accent);color:#1a1a1a}
.role-banner.guesser{background:#2f7de1;color:#fff}
.panel{background:var(--panel);border-radius:12px;padding:12px;margin-top:10px;font-size:14px;line-height:1.6}
.panel .ng{background:#fff;color:#222;border-radius:8px;padding:8px 10px;margin-top:8px}
.panel .ng b{color:#c0392b}
.bottom-btns{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.bottom-btns button{padding:14px;font-size:17px}
.p-center{text-align:center;padding:40px 16px}
.legend{display:flex;gap:10px;justify-content:center;font-size:13px;margin:6px 0 10px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px}
.spinner{width:40px;height:40px;border:4px solid #3a4a6b;border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===== モーダル・トースト ===== */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:#fff;color:#1d1d1f;border-radius:14px;padding:20px;max-width:460px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.modal h3{margin-bottom:10px}
.modal p{margin:6px 0}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.modal button{background:#e3e6ec;color:#1d1d1f}
.modal button.primary{background:var(--accent)}
.modal button.danger{background:var(--danger);color:#fff}
.modal .confirm-word{font-size:28px;font-weight:900;text-align:center;margin:10px 0}
.swap-cand{font-size:30px;font-weight:900;text-align:center;margin:12px 0;padding:12px;background:#f4f1e4;border-radius:10px}
.chk{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;transform:scale(1.2)}
#toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:200;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{background:#222c44;color:#fff;border-radius:12px;padding:10px 18px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.4);animation:tin .2s ease-out;text-align:center}
.toast.clear{background:var(--clear);color:#222}
.toast.neutral{background:#5b6475}
.toast.black{background:#000;border:2px solid var(--danger)}
.toast.next{background:#2f7de1}
body.host .toast.big{font-size:36px;padding:18px 36px;margin-top:30vh}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

/* ===== 管理 ===== */
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid #33415f;text-align:left}
th{color:var(--muted);font-weight:700;white-space:nowrap}
td:nth-child(-n+3){white-space:nowrap}
.table-wrap{overflow-x:auto}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-weight:800;font-size:13px}
.tag.clear{background:var(--ok);color:#10301c}
.tag.fail{background:var(--danger);color:#fff}
.ex-list{display:flex;flex-wrap:wrap;gap:8px}
.ex-item{background:var(--panel2);border-radius:8px;padding:6px 8px 6px 12px;display:inline-flex;align-items:center;gap:8px;font-weight:700}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
@media (max-width:700px){ .status-bar,.stats4{grid-template-columns:repeat(2,1fr)} }
.settings-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:8px}
.settings-grid label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}
input[type=number],select{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid #4a5a7c;background:#0d1526;color:var(--text)}
@media (max-width:700px){ .settings-grid{grid-template-columns:1fr} }

/* ===== ゲーム選択 ===== */
.game-select{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:900px;margin:0 auto}
.game-card{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;padding:40px 20px;border-radius:18px;
  background:var(--panel);border:2px solid #34466b;color:var(--text)}
.game-card:hover{border-color:var(--accent);filter:none;transform:translateY(-2px)}
.game-card .gname{font-size:40px;font-weight:900;color:var(--accent)}
.game-card .gdesc{font-size:16px;color:var(--muted);font-weight:600}
@media (max-width:700px){ .game-select{grid-template-columns:1fr} }

/* ===== ニゴアマリ ===== */
.ng-words{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.ng-words.compact{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ng-word{background:#fff;color:#1d1d1f;border-radius:12px;display:flex;align-items:center;gap:12px;padding:14px 16px;font-weight:800;font-size:28px;border:3px solid transparent}
.ng-words.compact .ng-word{font-size:19px;padding:8px 10px;gap:8px}
.ng-word .num{flex:none;width:46px;height:46px;border-radius:50%;background:#1d2a48;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:900}
.ng-words.compact .ng-word .num{width:32px;height:32px;font-size:17px}
.ng-word .w{word-break:break-all;line-height:1.2}
.ng-word.clickable{cursor:pointer}
.ng-word.clickable:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.35)}
.ng-word.answer{background:#fff1b8;border-color:var(--clear);box-shadow:0 0 0 4px rgba(255,210,63,.35)}
.ng-word.answer .num{background:#e0a800;color:#222}
.timer-wrap{text-align:center;margin:6px 0 14px}
.timer{display:inline-block;min-width:160px;font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;background:var(--panel);border-radius:16px;padding:4px 28px;color:var(--accent)}
.timer.sub{font-size:40px;min-width:110px;padding:2px 18px}
.timer.hurry{color:#ff7a59}
.timer.timeup{color:#fff;background:var(--danger);font-size:40px}
.timer.sub.timeup{font-size:26px}
.big-btn{font-size:20px;padding:14px 36px}
.rv-title{text-align:center;font-size:30px;margin:6px 0 16px}
.rv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.rv-card{background:var(--panel);border-radius:14px;padding:14px;text-align:center;border:3px solid transparent}
.rv-card.correct{background:#174d2e;border-color:var(--ok)}
.rv-card.wrong{opacity:.75}
.rv-name{font-size:22px;font-weight:900}
.rv-hint{color:var(--muted);margin:4px 0 8px;font-weight:700}
.rv-guess{font-size:22px;font-weight:800}
.rv-pt{margin-top:8px;font-weight:900;font-size:20px}
.rv-pt.plus,td.plus{color:var(--ok)}
td.minus{color:#ff7a7a}
.numtag{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 8px;border-radius:18px;background:var(--accent);color:#1a1a1a;font-weight:900;font-size:20px;margin-right:6px}
.numtag.big{min-width:120px;height:120px;border-radius:60px;font-size:72px}
.numword{font-weight:800}
.answer-banner{text-align:center;background:linear-gradient(135deg,#6b4a00,#c99400);border-radius:18px;padding:18px;margin-bottom:16px;animation:pop .45s ease-out}
.answer-banner .lbl{font-size:22px;font-weight:800}
.answer-banner .ans{display:flex;align-items:center;justify-content:center;gap:18px;margin:8px 0}
.answer-banner .answord{font-size:56px;font-weight:900;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.answer-banner .sub{font-size:22px;font-weight:800}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
.assign-table td{font-size:18px;padding:10px}
.assign-table tr.ok td{background:rgba(60,207,122,.12)}
.assign-table tr.pen td{background:rgba(229,72,77,.15)}
.pen-box{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.pen-item{background:#4a1518;border:2px solid var(--danger);border-radius:12px;padding:12px 16px;font-size:18px;line-height:1.7}
.pen-head{font-size:24px;font-weight:900;color:#ffd0d0}
.pen-none{background:var(--panel);border-radius:12px;padding:12px 16px;font-size:18px;text-align:center}
.tie-note{background:#2c2410;border:2px solid var(--accent);color:#ffe9a8;border-radius:12px;padding:12px;text-align:center;font-size:22px;font-weight:900;margin-bottom:14px}
.rank-list{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.rank-row{display:flex;align-items:center;gap:16px;background:var(--panel);border-radius:14px;padding:14px 20px;font-size:26px;font-weight:900;animation:pop .45s ease-out}
.rank-row .rk{width:90px}
.rank-row .rn{flex:1}
.rank-row .rs{color:var(--accent)}
.rank-row.r1{background:linear-gradient(135deg,#7a5a00,#d4a106);font-size:34px}
.rank-row.r1 .rs,.rank-row.r2 .rs,.rank-row.r3 .rs{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.rank-row.r2{background:linear-gradient(135deg,#4b5563,#9aa3b2)}
.rank-row.r3{background:linear-gradient(135deg,#5a3410,#a8662a)}
.rank-row.hidden{background:transparent;border:2px dashed #3a4a6b;color:var(--muted);animation:none}
.rank-low{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.rank-low .rank-row{font-size:20px;padding:10px 20px}
/* サブ */
.my-nums{display:flex;gap:14px;justify-content:center;margin:8px 0 10px}
.my-num{width:72px;height:72px;border-radius:50%;background:var(--accent);color:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:38px;font-weight:900}
.memo-row{border-top:1px solid #33415f;padding:8px 0}
.memo-name{font-size:15px;margin-bottom:6px}
.memo-chips{display:flex;flex-wrap:wrap;gap:5px}
.memo-chip{min-width:36px;height:36px;padding:0;border-radius:8px;background:#0d1526;border:1px solid #4a5a7c;color:var(--text);font-size:15px}
.memo-chip.on{background:var(--accent);color:#1a1a1a;border-color:var(--accent)}
.unchecked{font-size:16px;background:#0d1526;border-radius:8px;padding:8px 10px}
.unchecked b{color:var(--accent);font-size:20px}
#ng-guess{flex:1;font-size:18px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast"></div>

<script>
/* =========================================================
   ワードネーム（2人協力ワードゲーム）／ニゴアマリ（3人以上）
   ・パラメータなし     … メイン（PC：ゲーム選択 → QR表示・進行）
   ・?room=XXXX        … サブ（スマホ。メインで選んだゲームの画面に自動で切り替わる）
   ・?mode=admin       … 管理ページ（2ゲーム共通：除外単語・単語使用状況／ゲーム別：履歴・設定）
   単語リスト・除外リスト・使用状況は2ゲームで共有する。
   ========================================================= */
const GAME_TITLE = 'ワードネーム';
const APP_TITLE = 'ワードネーム／ニゴアマリ';
const GAMES = {
  wordname:  { title:'ワードネーム', desc:'2人協力。ヒントから相手の緑の単語を当てる（2人用）' },
  nigoamari: { title:'ニゴアマリ',   desc:'2つの数字に共通する言葉から、余った1つを当てる（3人以上）' }
};
const NG_MIN_PLAYERS = 3;

/* ---------- 共通ユーティリティ ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function other(s){ return s==='A'?'B':'A'; }
function lsGet(k, def){ try{ const v=localStorage.getItem(k); return v==null?def:JSON.parse(v); }catch(e){ return def; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){ alert('ブラウザへの保存に失敗しました'); } }
function fmtDate(t){ const d=new Date(t), p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
function fmtDuration(ms){ const s=Math.round(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60), sec=s%60; return (h?`${h}時間`:'')+`${m}分${String(sec).padStart(2,'0')}秒`; }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }

/* 単語の見た目の長さ（半角は細いので0.55文字扱い） */
function vlen(w){ let n=0; for(const ch of String(w)) n += /[\x20-\x7e]/.test(ch) ? 0.55 : 1; return n; }
/* 長い単語は真ん中で2行に分ける（メイン：9文字以上／サブ：6文字以上） */
function wrapAt(){ return MODE==='host' ? 9 : 6; }
function wordHtml(w){
  const chars=[...String(w)];
  if(vlen(w)<wrapAt()) return esc(w);
  const mid=Math.ceil(chars.length/2);
  return esc(chars.slice(0,mid).join(''))+'<br>'+esc(chars.slice(mid).join(''));
}
function cellFontCss(w){
  let n=vlen(w);
  const wrapped = n>=wrapAt();
  if(wrapped) n=Math.ceil([...String(w)].length/2);   // 1行あたりの文字数
  if(MODE==='host'){
    const px = wrapped ? 30 : n<=4?40 : n<=5?34 : n<=6?29 : n<=7?25 : 22;
    return `min(${px}px, ${(px/11).toFixed(2)}vw)`;
  }
  const v = wrapped ? (n<=3?3.6 : n<=4?3.4 : 3.0) : (n<=2?4.8 : n<=3?4.4 : n<=4?3.8 : 3.0);
  return `min(${v}vw, ${(v*5.2).toFixed(1)}px)`;
}

/* 盤面HTML（メイン・サブ共通） o = {key, cleared, neutral, selectable, clickable} */
function boardHtml(board, o){
  o=o||{};
  return `<div class="board">${board.map((w,i)=>{
    const cls=['cell'];
    const k=o.key?o.key[i]:'n';
    if(k==='g') cls.push('k-g'); else if(k==='k') cls.push('k-k');
    const cl=!!(o.cleared&&o.cleared[i]);
    const ne=!cl && !!(o.neutral&&o.neutral[i]);
    if(cl) cls.push('is-clear');
    if(ne) cls.push('is-neutral');
    if(o.selectable&&o.selectable[i]) cls.push('tappable');
    if(o.clickable) cls.push('clickable');
    const badge = cl ? '<span class="badge clear">クリア</span>' : ne ? '<span class="badge neutral">一般</span>' : '';
    return `<div class="${cls.join(' ')}" data-idx="${i}"><span class="w" style="font-size:${cellFontCss(w)}">${wordHtml(w)}</span>${badge}</div>`;
  }).join('')}</div>`;
}

function openModal(html, buttons){
  const wrap=document.createElement('div');
  wrap.className='modal-bg';
  wrap.innerHTML=`<div class="modal">${html}<div class="modal-btns"></div></div>`;
  const close=()=>wrap.remove();
  (buttons||[{label:'閉じる'}]).forEach(b=>{
    const el=document.createElement('button');
    el.textContent=b.label; if(b.cls) el.className=b.cls;
    el.onclick=()=>{ if(b.onClick && b.onClick()===false) return; close(); };
    wrap.querySelector('.modal-btns').appendChild(el);
  });
  document.getElementById('modal-root').appendChild(wrap);
  return {el:wrap, close};
}

/* ---------- 単語リスト・使用状況・除外 ---------- */
function getWordList(){
  const w=lsGet(LS.words, null);
  const list = Array.isArray(w)&&w.length ? w : DEFAULT_WORDS;
  return [...new Set(list.map(s=>String(s).trim()).filter(Boolean))];
}
function getUsed(){ return new Set(lsGet(LS.used, [])); }
function setUsed(s){ lsSet(LS.used, [...s]); }
function getExcluded(){ return new Set(lsGet(LS.excluded, [])); }
function setExcluded(s){ lsSet(LS.excluded, [...s]); }
function getHistory(){ return lsGet(LS.history, []); }
function setHistory(h){ lsSet(LS.history, h); }

/** まだ使っていない（かつ除外されていない）単語。skip に入っている単語も除く */
function availablePool(skip){
  const used=getUsed(), ex=getExcluded(), sk=new Set(skip||[]);
  return getWordList().filter(w=>!used.has(w) && !ex.has(w) && !sk.has(w));
}
function usableCount(){ const ex=getExcluded(); return getWordList().filter(w=>!ex.has(w)).length; }

/**
 * n個の単語を重複なしで選ぶ（使用済みにする）。
 * 未使用が足りない時は、使用状況のリセットを確認してから、残りを先に使い、足りない分をリセット後の単語から選ぶ。
 * キャンセル時は null。
 */
function pickWords(n, onBoard){
  onBoard=onBoard||[];
  let pool=availablePool(onBoard);
  let first=[];
  let didReset=false;
  if(pool.length<n){
    if(usableCount()-onBoard.length < n){ alert(`使える単語が${n}個に足りません。管理ページで除外単語を減らすか、単語リストを確認してください。`); return null; }
    const msg = `未使用の単語が残り${pool.length}個しかありません（${n}個必要）。\n\n単語の使用状況をリセットしますか？\n` +
      (pool.length ? `（残りの${pool.length}個を先に使い、足りない分をリセット後の単語から選びます）` : '');
    if(!confirm(msg)) return null;
    first=shuffle(pool);
    setUsed(new Set());
    didReset=true;
    pool=availablePool([...onBoard, ...first]);
  }
  const picked=first.concat(shuffle(pool).slice(0, n-first.length));
  const used=getUsed();
  picked.forEach(w=>used.add(w));
  if(didReset) onBoard.forEach(w=>used.add(w));
  setUsed(used);
  return shuffle(picked);   // 配置もランダム
}

  // 結果発表以降の「次へ」は Enter キーでも進める
  document.addEventListener('keydown', e=>{
    if(e.key!=='Enter' || e.isComposing) return;
    if(document.querySelector('#modal-root .modal-bg')) return;
    if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    const b=document.querySelector('#app [data-enter]');
    if(b && !b.disabled){ e.preventDefault(); b.click(); }
  });
  setInterval(tickTimer, 250);
  renderHost();
}

function startPeer(roomId, retry){
  const id=roomId||genRoomId();
  if(peer){ try{ peer.destroy(); }catch(e){} }
  peer=new Peer(id);
  peer.on('open', pid=>{ myHostId=pid; lsSet(LS.room, pid); saveState(); renderHost(); });
  peer.on('connection', conn=>{
    allConns.add(conn);
    conn.on('data', data=>routeSubMessage(conn, data));
    conn.on('close', ()=>{
      allConns.delete(conn);
      const s=conn._side;
      if(s && conns[s]===conn){ conns[s]=null; connected[s]=false; }
      const p=conn._ngpid;
      if(p && ngConns[p]===conn) delete ngConns[p];
      renderHost();
    });
  });
  peer.on('error', err=>{
    if(err && err.type==='unavailable-id'){
      // 再開時は前の部屋番号がまだ解放されていないことがあるので数回リトライしてから新番号へ
      if(roomId && retry<5){ setTimeout(()=>startPeer(roomId, retry+1), 3000); }
      else { showToast('部屋番号を新しくしました。スマホはQRから入り直してください', '', 5000); startPeer(null, 0); }
    } else { console.error(err); }
  });
  peer.on('disconnected', ()=>{ try{ peer.reconnect(); }catch(e){} });
}

function saveState(){
  lsSet(LS.hostGame, hostGame);
  if(hostGame==='wordname') lsSet(LS.state, gs);
  if(hostGame==='nigoamari') lsSet(LS.ngState, ng);
}
function commit(){ saveState(); syncAll(); renderHost(); }

/** サブからのメッセージを、今進行中のゲームに振り分ける */
function routeSubMessage(conn, data){
  if(!data || !data.type) return;
  if(hostGame==='wordname') handleSubMessage(conn, data);
  else if(hostGame==='nigoamari') ngHandle(conn, data);
  else if(data.type==='join'){ try{ conn.send({type:'wait'}); }catch(e){} }
}
function resetConnBindings(){
  conns.A=conns.B=null; connected.A=connected.B=false;
  Object.keys(ngConns).forEach(k=>delete ngConns[k]);
  allConns.forEach(c=>{ delete c._side; delete c._ngpid; });
}
/** ゲームを選ぶ。つながっているスマホには入り直し（rejoin）を頼み、選んだゲームの参加者として登録し直す */
function selectGame(g){
  if(!GAMES[g]) return;
  hostGame=g;
  gs=freshState(); ng=ngFresh();
  resetConnBindings();
  saveState(); renderHost();
  allConns.forEach(c=>{ if(c.open){ try{ c.send({type:'rejoin'}); }catch(e){} } });
}
function backToSelect(){
  if(!confirm('ゲーム選択に戻りますか？\n（今のゲームの進行は消えます。スマホはそのまま次のゲームに参加できます）')) return;
  hostGame=null;
  gs=freshState(); ng=ngFresh();
  resetConnBindings();
  localStorage.removeItem(LS.state); localStorage.removeItem(LS.ngState);
  saveState(); closeAllModals(); renderHost();
  allConns.forEach(c=>{ if(c.open){ try{ c.send({type:'wait'}); }catch(e){} } });
}
function sendTo(side, msg){ const c=conns[side]; if(c && c.open){ try{ c.send(msg); }catch(e){} } }
function syncAll(){ ['A','B'].forEach(s=>sendTo(s, snapshotFor(s))); }

function setEvent(type, text, extra){
  gs.evSeq=(gs.evSeq||0)+1;
  gs.lastEvent=Object.assign({id:gs.evSeq, type, text}, extra||{});
}

/** サブに送る画面情報（サブ側は毎回これで上書きするだけ） */
function snapshotFor(side){
  const ph=gs.phase;
  const inGame=['keycheck','playing','ended'].includes(ph);
  const role = ph==='playing' ? (gs.giver===side ? 'giver' : 'guesser') : null;
  // 一般マークは常に「今の解読側が自分でタップして出したもの」を表示（出題側にも同じものを表示）
  const neutralMark = currentNeutral();
  return {
    type:'state', game:'wordname', title:GAME_TITLE, phase:ph, side,
    name: gs.players[side] ? gs.players[side].name : '',
    partnerName: gs.players[other(side)] ? gs.players[other(side)].name : '',
    partnerConnected: connected[other(side)],
    board: inGame ? gs.board : null,
    key: inGame && role!=='guesser' ? keyOf(side) : null,     // 解読側の時は自分の色を見せない
    cleared: gs.cleared, neutral: neutralMark,
    selectable: role==='guesser' ? gs.board.map((_,i)=>!gs.cleared[i] && !gs.neutral[gs.giver][i]) : null,
    confirmed: !!gs.confirmed[side], partnerConfirmed: !!gs.confirmed[other(side)],
    turn: gs.turn, maxTurn: MAX_TURN, role,
    remaining: inGame ? remainingTotal() : 0,
    result: gs.result, lastEvent: gs.lastEvent,
    timerOn: wnTimerOn() && ph==='playing', timerSec: wnTimerOn() ? gs.timer.sec : null,
    remainingMs: wnTimerOn() && ph==='playing' ? Math.max(0, gs.turnEndsAt-Date.now()) : 0
  };
}

function handleSubMessage(conn, data){
  if(!data || !data.type) return;
  if(data.type==='join'){
    const pid=String(data.pid||''), name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    let side=['A','B'].find(s=>gs.players[s] && gs.players[s].pid===pid);
    if(!side){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      side=['A','B'].find(s=>gs.players[s] && gs.players[s].name===name && !connected[s]);
      if(side) gs.players[side].pid=pid;
    }
    if(!side){
      if(['A','B'].some(s=>gs.players[s] && gs.players[s].name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      side=['A','B'].find(s=>!gs.players[s]);
      if(!side){ try{ conn.send({type:'full'}); }catch(e){} return; }
      gs.players[side]={pid, name};
    } else {
      gs.players[side].name=name;
    }
    const old=conns[side];
    conn._side=side; conns[side]=conn; connected[side]=true;
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    if(gs.phase==='lobby' && bothJoined()) enterPrep();
    commit();
    return;
  }
  const side=conn._side;
  if(!side || conns[side]!==conn) return;
  if(data.type==='confirm'){
    if(gs.phase!=='keycheck') return;
    gs.confirmed[side]=true;
    if(gs.confirmed.A && gs.confirmed.B) startPlaying();
    commit();
  } else if(data.type==='guess'){
    handleGuess(side, Number(data.idx));
  } else if(data.type==='next_turn'){
    if(gs.phase!=='playing' || data.turn!==gs.turn) return;   // 2人同時に押しても1回だけ進める
    const by=pname(side);
    if(advanceTurn()) setEvent('next', `${by}さんが次のターンへ進めました → 第${gs.turn}ターン`);
    commit();
  }
}

/* ----- 進行 ----- */
function enterPrep(){
  gs.phase='prep';
  resetRound();
  newBoard();
}
/**
 * 新しい25語の盤面を作る。skip の単語（今の盤面など）は選ばない。
 * キャンセル時は今の盤面のまま（盤面が空なら空のまま）。
 * boardWords＝この盤面のために使用済みにした単語（入れ替えで使った単語も含む）。履歴削除時に未使用へ戻すのに使う。
 */
function newBoard(skip){
  const w=pickWords(25, skip||[]);
  if(w){ gs.board=w; gs.boardWords=w.slice(); }
  return !!w;
}
function resetRound(){
  gs.keyA=[]; gs.keyB=[]; gs.cleared=[]; gs.neutral={A:[],B:[]};
  gs.confirmed={A:false,B:false}; gs.turn=0; gs.result=null; gs.turnEndsAt=0;
}
/**
 * 色の配置。各サブ：緑9・黒3。
 * 共通緑3／共通黒1／A緑・B黒1／A黒・B緑1／A緑のみ5／B緑のみ5／A黒のみ1／B黒のみ1／どちらも色なし7
 */
function generateKeys(){
  const idx=shuffle([...Array(25).keys()]);
  const A=Array(25).fill('n'), B=Array(25).fill('n');
  let p=0;
  const take=(n,a,b)=>{ for(let i=0;i<n;i++){ const c=idx[p++]; A[c]=a; B[c]=b; } };
  take(3,'g','g'); take(1,'k','k'); take(1,'g','k'); take(1,'k','g');
  take(5,'g','n'); take(5,'n','g'); take(1,'k','n'); take(1,'n','k');
  gs.keyA=A; gs.keyB=B;
}
/* ワードネームの制限時間（ハードモード）。準備画面で選んだ内容を覚えておく（初期値：なし・120秒） */
function wnTimerPref(){ const s=lsGet(LS.settings,{})||{}; return { on:!!s.wnTimerOn, sec:Number(s.wnTimerSec)||120 }; }
function setWnTimerPref(on, sec){ lsSet(LS.settings, Object.assign(lsGet(LS.settings,{})||{}, {wnTimerOn:!!on, wnTimerSec:sec})); }
function wnTimerOn(){ return !!(gs.timer && gs.timer.on); }
function setTurnTimer(){ gs.turnEndsAt = wnTimerOn() ? Date.now()+gs.timer.sec*1000 : 0; }
/** 制限時間切れ：自動で次のターンへ（メインのタイマーから呼ぶ） */
function wnTimeUp(){
  if(gs.phase!=='playing' || !wnTimerOn() || !gs.turnEndsAt || Date.now()<gs.turnEndsAt) return;
  gs.turnEndsAt=0;
  if(advanceTurn()) setEvent('next', `⏱ 時間切れ！ → 第${gs.turn}ターン`);
  commit();
}
function startKeycheck(){
  if(gs.board.length!==25 || !bothJoined()) return;
  resetRound();
  const tp=wnTimerPref();
  gs.timer={ on:tp.on, sec:tp.sec };   // ゲーム開始時の設定で固定
  generateKeys();
  gs.cleared=Array(25).fill(false);
  gs.neutral={A:Array(25).fill(false), B:Array(25).fill(false)};
  gs.phase='keycheck';
  commit();
}
function startPlaying(){
  gs.phase='playing';
  gs.turn=1;
  gs.giver=Math.random()<0.5?'A':'B';
  gs.startedAt=Date.now();   // クリア時間の計測用（ゲーム中は表示しない）
  setTurnTimer();
  setEvent('start', `ゲームスタート！ 最初の出題は ${pname(gs.giver)}さん`);
}
/** ターンを進める。最終ターンを越えたらゲームオーバー。戻り値：ゲーム継続ならtrue */
function advanceTurn(){
  if(gs.turn>=MAX_TURN){ endGame('fail','turn'); return false; }
  gs.turn++;
  const nx=other(gs.giver);
  // 次の出題者の緑がもう残っていない時は、緑が残っている側が続けて出題する
  if(remainingFor(nx)>0) gs.giver=nx;
  setTurnTimer();            // 制限時間ありなら、ターンごとに最初からカウントダウン
  return true;
}
function handleGuess(side, idx){
  if(gs.phase!=='playing' || side===gs.giver) return;
  if(!(idx>=0 && idx<25)) return;
  const giver=gs.giver;
  if(gs.cleared[idx] || gs.neutral[giver][idx]) return;
  const word=gs.board[idx], by=pname(side);
  const k=keyOf(giver)[idx];
  if(k==='g'){
    gs.cleared[idx]=true;
    if(remainingTotal()===0){ endGame('clear'); }
    else if(remainingFor(giver)===0){
      if(advanceTurn()) setEvent('clear', `「${word}」クリア！ ${pname(giver)}さんの緑はすべて見つかりました → 第${gs.turn}ターン`, {idx});
    } else {
      setEvent('clear', `「${word}」クリア！ 続けて選べます`, {idx});
    }
  } else if(k==='k'){
    endGame('fail','black', idx);
  } else {
    gs.neutral[giver][idx]=true;
    if(advanceTurn()) setEvent('neutral', `「${word}」は一般でした → 第${gs.turn}ターン`, {idx});
  }
  commit();
}
function endGame(type, reason, idx){
  gs.phase='ended';
  const found=15-remainingTotal();
  gs.result={type, reason:reason||'clear', turn:gs.turn, word: idx!=null ? gs.board[idx] : null, found};
  if(type==='clear') setEvent('clear', `🎉 ゲームクリア！（第${gs.turn}ターン）`);
  else if(reason==='black') setEvent('black', `「${gs.board[idx]}」は黒… ゲームオーバー`, {idx});
  else setEvent('black', `${MAX_TURN}ターンが終了… ゲームオーバー`);
  const h=getHistory();
  const now=Date.now();
  h.push({ id:uid(), game:'wordname', at:now, result:type, turn:gs.turn, reason:gs.result.reason, word:gs.result.word,
           found, players:`${pname('A')} ＆ ${pname('B')}`,
           clearMs: type==='clear' && gs.startedAt ? now-gs.startedAt : null,
           timerSec: wnTimerOn() ? gs.timer.sec : null,
           words: (gs.boardWords && gs.boardWords.length ? gs.boardWords : gs.board).slice() });
  setHistory(h);
}
function playAgain(){
  gs.phase='prep';
  resetRound();
  if(!newBoard()) gs.board=[];
  commit();
}

/* ----- 単語の入れ替え（準備画面） ----- */
function nextCandidate(board, cur){
  let pool=availablePool(board).filter(w=>w!==cur);
  if(!pool.length){
    if(cur!=null){ showToast('ほかの候補がありません'); return null; }
    if(usableCount()-board.length<=0){ alert('入れ替えに使える単語がありません'); return null; }
    if(!confirm('未使用の単語がなくなりました。\n単語の使用状況をリセットしますか？')) return null;
    setUsed(new Set(board));
    pool=availablePool(board);
    if(!pool.length){ alert('入れ替えに使える単語がありません'); return null; }
  }
  return pool[Math.floor(Math.random()*pool.length)];
}
/* 入れ替え対象（進行中のゲームの準備画面の単語） */
function swapCtx(){
  if(hostGame==='nigoamari') return { board:ng.words, ok:()=>ng.phase==='prep',
    apply:(i,c)=>{ ng.words[i]=c; ng.gameWords.push(c); ngCommit(); } };
  return { board:gs.board, ok:()=>gs.phase==='prep',
    apply:(i,c)=>{ gs.board[i]=c; (gs.boardWords=gs.boardWords||gs.board.slice()).push(c); commit(); } };
}
function openSwap(i){
  const ctx=swapCtx();
  if(!ctx.ok()) return;
  const oldW=ctx.board[i];
  let cand=nextCandidate(ctx.board, null);
  if(cand==null) return;
  const m=openModal(`
    <h3>「${esc(oldW)}」を入れ替え</h3>
    <p class="muted" style="color:#666;font-size:14px">盤面にない単語からランダムに選んでいます</p>
    <div class="swap-cand" id="cand-word">${esc(cand)}</div>
    <div style="text-align:center"><button id="btn-reroll">🎲 別の単語にする</button></div>
    <label class="chk"><input type="checkbox" id="chk-ex"><span>「${esc(oldW)}」を除外リストに入れる<br><small style="color:#666">（今後このゲームで選ばれなくなります。管理ページで確認・解除できます）</small></span></label>
  `, [
    {label:'キャンセル'},
    {label:'入れ替える', cls:'primary', onClick:()=>{
      const c2=swapCtx();
      if(!c2.ok() || c2.board[i]!==oldW) return;
      const ex=m.el.querySelector('#chk-ex').checked;
      const used=getUsed(); used.add(cand); setUsed(used);
      if(ex){ const e=getExcluded(); e.add(oldW); setExcluded(e); }
      c2.apply(i, cand);
      showToast(`「${oldW}」→「${cand}」に入れ替えました${ex?'（除外リストに追加）':''}`);
    }}
  ]);
  m.el.querySelector('#btn-reroll').onclick=()=>{
    const c=nextCandidate(swapCtx().board, cand);
    if(c!=null){ cand=c; m.el.querySelector('#cand-word').textContent=c; }
  };
}

function openQrModal(){
  if(!myHostId){ showToast('部屋を準備中です'); return; }
  const m=openModal(`<h3>参加用QRコード</h3><div style="text-align:center"><div class="qrbox" id="qr-modal"></div><div class="url" style="color:#666">${esc(joinUrl())}</div></div>`);
  new QRCode(m.el.querySelector('#qr-modal'), {text:joinUrl(), width:260, height:260});
}

function onHostClick(e){
  const cell=e.target.closest('.cell.clickable, .ng-word.clickable');
  if(cell){ openSwap(Number(cell.dataset.idx)); return; }
  const b=e.target.closest('[data-act]');
  if(!b) return;
  const act=b.dataset.act;
  if(act==='qr') openQrModal();
  else if(act==='admin') location.href=location.pathname+'?mode=admin';
  else if(act==='newroom'){
    if(!confirm('新しい部屋を作り直しますか？\n（今の進行状況は消え、スマホはQRから入り直しになります）')) return;
    clearGameSaves();
    location.reload();
  }
  else if(act==='selectgame') selectGame(b.dataset.game);
  else if(act==='toselect') backToSelect();
  else if(hostGame==='nigoamari') ngOnAction(act, b);
  else if(act==='kick'){
    const s=b.dataset.side;
    if(!gs.players[s] || !confirm(`${pname(s)}さん（サブ${s}）を参加者から外しますか？\n（ゲーム中の場合、次に参加した人がサブ${s}を引き継ぎます）`)) return;
    sendTo(s, {type:'removed'});
    const c=conns[s]; conns[s]=null; connected[s]=false; gs.players[s]=null;
    setTimeout(()=>{ try{ c&&c.close(); }catch(err){} }, 300);
    commit();
  }
  else if(act==='pick'){ if(newBoard()) commit(); }
  else if(act==='repick'){
    if(!confirm('25個の単語をすべて選び直しますか？')) return;
    if(newBoard(gs.board)) commit();
  }
  else if(act==='start') startKeycheck();
  else if(act==='toprep'){
    if(!confirm('準備画面に戻りますか？\n（今のゲームは記録されず、新しい25個の単語に変わります）')) return;
    gs.phase='prep'; resetRound(); newBoard(gs.board); commit();
  }
  else if(act==='again') playAgain();
}

/* 今の解読側が出した一般マーク（クリアで上書きされたマスは除く）。メイン・サブ共通 */
function currentNeutral(){

  return gs.board.map((_,i)=>!!gs.neutral[gs.giver][i] && !gs.cleared[i]);
}
function hostMarks(){ return { cleared:gs.cleared, neutral:currentNeutral() }; }

/* =========================================================
   ニゴアマリ（メイン）
   ・単語を「人数×2＋1」個並べて1から番号を振る
   ・各参加者に重複なしで番号を2つずつ配る（必ず1つ余る＝正解）
   ・ヒント入力 → 予想フェイズ（余りの番号を予想） → 結果発表（予想／正解／割り振り＋ペナルティ）
   ========================================================= */
let ng=null;
const ngConns={};

function ngFresh(){
  return { phase:'lobby', players:{}, order:[], qNo:0, practiceMode:false, qId:'', words:[], gameWords:[],
           assign:{}, answer:0, hints:{}, guesses:{}, endsAt:0, revealStep:0, rv:null,
           doneQ:0, finalStep:0, finalData:null };
}
function ngIds(){ return ng.order.filter(p=>ng.players[p]); }
function ngName(p){ return ng.players[p] ? ng.players[p].name : '（退出）'; }
function ngOnline(p){ const c=ngConns[p]; return !!(c && c.open); }
function ngWordCount(){ return ngIds().length*2+1; }
/* 例題（管理ページで「1問目を例題にする」ON の時の1問目）。得点は合計に入れず、問題数にも数えない */
function ngIsPractice(){ return !!ng.practiceMode && ng.qNo===1; }
function ngQLabel(){ return ngIsPractice() ? '例題' : `第${ng.practiceMode ? ng.qNo-1 : ng.qNo}問`; }
function ngCommit(){ saveState(); ngSyncAll(); renderHost(); }
function ngSyncAll(){ Object.keys(ngConns).forEach(p=>{ const c=ngConns[p]; if(c && c.open && ng.players[p]){ try{ c.send(ngSnapshotFor(p)); }catch(e){} } }); }

function ngHandle(conn, data){
  if(data.type==='join'){
    const pid=String(data.pid||''), name=String(data.name||'').trim().slice(0,12);
    if(!pid || !name) return;
    let p = ng.players[pid] ? pid : null;
    if(!p){
      // タブを閉じて入り直した人：同じニックネームで切断中の人がいれば、その人として復帰
      const e=Object.keys(ng.players).find(id=>ng.players[id].name===name && !ngOnline(id));
      if(e) p=e;
    }
    if(!p){
      if(Object.values(ng.players).some(o=>o.name===name)){ try{ conn.send({type:'name_taken'}); }catch(e){} return; }
      p=pid; ng.players[p]={name, score:0}; ng.order.push(p);
    } else ng.players[p].name=name;
    const old=ngConns[p];
    conn._ngpid=p; ngConns[p]=conn;
    if(old && old!==conn){ try{ old.close(); }catch(e){} }
    ngCommit();
    return;
  }
  const p=conn._ngpid;
  if(!p || ngConns[p]!==conn || !ng.players[p]) return;
  if(data.type==='ng_hint'){
    if(ng.phase!=='hint' || !ng.assign[p]) return;   // 制限時間が過ぎても予想フェイズまでは受け付ける
    ng.hints[p]=String(data.text||'').trim().slice(0,30);
    ngCommit();
  } else if(data.type==='ng_guess'){
    if(ng.phase!=='predict' || !ng.assign[p]) return; // 制限時間が過ぎても結果発表までは受け付ける
    const n=Number(data.num);
    if(!(n>=1 && n<=ng.words.length)) return;
    ng.guesses[p]=n;
    ngCommit();
  }
}

/** 次の問題（準備画面）へ。単語を「人数×2＋1」個選ぶ */
function ngNewQuestion(){
  if(ngIds().length<NG_MIN_PLAYERS){ alert(`${NG_MIN_PLAYERS}人以上いないと始められません`); return false; }
  const w=pickWords(ngWordCount(), []);
  if(!w) return false;
  if(ng.qNo===0) ng.practiceMode=!!ngSettings().practiceFirst;   // ゲーム開始時の設定で「1問目＝例題」を決める
  ng.qNo++; ng.qId=uid(); ng.words=w; ng.gameWords.push(...w);
  ng.assign={}; ng.hints={}; ng.guesses={}; ng.answer=0; ng.rv=null; ng.revealStep=0; ng.endsAt=0;
  ng.phase='prep';
  return true;
}
/** 番号を配ってヒント入力開始 */
function ngStartHint(){
  const ids=ngIds();
  if(ids.length<NG_MIN_PLAYERS){ alert(`${NG_MIN_PLAYERS}人以上いないと始められません`); return; }
  if(ng.words.length!==ngWordCount()){
    if(!confirm(`参加人数が変わったため、単語の数（${ng.words.length}個）が合いません。\n${ngWordCount()}個で選び直しますか？`)) return;
    const w=pickWords(ngWordCount(), ng.words); if(!w) return;
    ng.words=w; ng.gameWords.push(...w); ngCommit(); return;
  }
  const nums=shuffle([...Array(ng.words.length).keys()].map(i=>i+1));
  ng.answer=nums[0];                                  // 誰にも配られない（余る）番号が正解
  ng.assign={};
  shuffle(ids).forEach((p,i)=>{ ng.assign[p]=[nums[1+i*2], nums[2+i*2]].sort((a,b)=>a-b); });
  ng.hints={}; ng.guesses={};
  ng.phase='hint';
  ng.endsAt=Date.now()+ngSettings().time*1000;
  ngCommit();
}
function ngComputeReveal(){
  const st=ngSettings();
  const parts=Object.keys(ng.assign);
  const owner=num=>parts.find(q=>ng.assign[q].includes(num))||null;
  const rows=parts.map(p=>{
    const g=ng.guesses[p]!=null ? ng.guesses[p] : null;
    return { pid:p, name:ngName(p), hint:ng.hints[p]||'', guess:g, nums:ng.assign[p], correct:g===ng.answer, gain:0, loss:0 };
  });
  const pens=[];
  rows.forEach(r=>{
    if(r.correct) r.gain=st.correct;
    else if(r.guess!=null){ const o=owner(r.guess); if(o) pens.push({from:r.pid, num:r.guess, owner:o}); }
  });
  pens.forEach(x=>{ const r=rows.find(r=>r.pid===x.owner); if(r) r.loss+=st.penalty; });
  return { rows, pens, correctPts:st.correct, penaltyPts:st.penalty, appliedCorrect:false, appliedPenalty:false, practice:ngIsPractice() };
}
/** 結果発表の「次へ」：0=全員の予想 → 1=正解発表（正解者に加点） → 2=割り振り公開（誤答で書かれた人に減点） */
function ngRevealNext(){
  if(ng.phase!=='reveal' || ng.revealStep>=2) return;
  ng.revealStep++;
  if(ng.revealStep===1 && !ng.rv.appliedCorrect && !ng.rv.practice){
    ng.rv.rows.forEach(r=>{ if(r.gain && ng.players[r.pid]) ng.players[r.pid].score+=r.gain; });
    ng.rv.appliedCorrect=true;
  }
  if(ng.revealStep===2 && !ng.rv.appliedPenalty && !ng.rv.practice){
    ng.rv.rows.forEach(r=>{ if(r.loss && ng.players[r.pid]) ng.players[r.pid].score-=r.loss; });
    ng.rv.appliedPenalty=true;
  }
  ngCommit();
}
/** 最終結果発表へ。順位（同点は同率）を決め、履歴に記録 */
function ngToFinal(){
  if(!confirm('ゲームを終了して最終結果発表に進みますか？')) return;
  const list=ngIds().map(p=>({pid:p, name:ngName(p), score:ng.players[p].score}));
  list.forEach(x=>{ x.rank=1+list.filter(y=>y.score>x.score).length; });
  list.sort((a,b)=>a.rank-b.rank || ng.order.indexOf(a.pid)-ng.order.indexOf(b.pid));
  const steps=[3,2,1].filter(r=>list.some(x=>x.rank===r));        // 3位→2位→1位の順に発表（いない順位は飛ばす）
  const topTie=[1,2,3].some(r=>list.filter(x=>x.rank===r).length>1);
  ng.finalData={list, steps, topTie};
  ng.finalStep=0;
  ng.phase='final';
  if(ng.doneQ>0){
    const h=getHistory();
    h.push({ id:uid(), game:'nigoamari', at:Date.now(), questions:ng.doneQ,
             winners:list.filter(x=>x.rank===1).map(x=>x.name),
             players:list.map(x=>x.name).join('・'), words:ng.gameWords.slice() });
    setHistory(h);
  }
  ngCommit();
}
function ngPlayAgain(){
  ngIds().forEach(p=>{ ng.players[p].score=0; });
  ng.doneQ=0; ng.qNo=0; ng.gameWords=[]; ng.finalData=null; ng.finalStep=0;
  ng.phase='lobby';
  ngNewQuestion();
  ngCommit();
}

function ngOnAction(act, b){
  if(act==='ng-start'){ if(ngNewQuestion()) ngCommit(); }
  else if(act==='ng-repick'){
    if(!confirm(`${ngWordCount()}個の単語をすべて選び直しますか？`)) return;
    const w=pickWords(ngWordCount(), ng.words); if(!w) return;
    ng.words=w; ng.gameWords.push(...w); ngCommit();
  }
  else if(act==='ng-go') ngStartHint();
  else if(act==='ng-predict'){
    if(ng.phase!=='hint') return;
    ng.phase='predict'; ng.endsAt=Date.now()+ngSettings().predictTime*1000; ngCommit();
  }
  else if(act==='ng-reveal'){
    if(ng.phase!=='predict') return;
    const un=Object.keys(ng.assign).filter(p=>ng.guesses[p]==null).length;
    if(un && !confirm(`まだ予想を送っていない人が${un}人います。結果発表に進みますか？`)) return;
    ng.rv=ngComputeReveal(); ng.revealStep=0; if(!ngIsPractice()) ng.doneQ++; ng.phase='reveal'; ngCommit();
  }
  else if(act==='ng-rnext') ngRevealNext();
  else if(act==='ng-nextq'){ if(ngNewQuestion()) ngCommit(); }
  else if(act==='ng-final') ngToFinal();
  else if(act==='ng-fnext'){
    if(ng.phase!=='final' || ng.finalStep>=ng.finalData.steps.length) return;
    ng.finalStep++; ngCommit();
  }
  else if(act==='ng-again') ngPlayAgain();
  else if(act==='ng-kick'){
    const p=b.dataset.pid;
    if(!ng.players[p] || !confirm(`${ngName(p)}さんを参加者から外しますか？`)) return;
    const c=ngConns[p];
    if(c){ try{ c.send({type:'removed'}); }catch(e){} setTimeout(()=>{ try{ c.close(); }catch(err){} }, 300); }
    delete ngConns[p]; delete ng.players[p]; ng.order=ng.order.filter(x=>x!==p);
    ngCommit();
  }
}

/* ---- タイマー（メイン・サブ共通の表示更新） ---- */
let subEndsAt=0;
function timerText(ms){ return ms>0 ? String(Math.ceil(ms/1000)) : '時間切れ'; }
function tickTimer(){
  if(MODE==='host' && hostGame==='wordname' && gs && gs.phase==='playing' && wnTimerOn() && gs.turnEndsAt && Date.now()>=gs.turnEndsAt) wnTimeUp();
  const el=document.getElementById('ng-timer'); if(!el) return;
  const end = MODE==='host' ? (hostGame==='wordname' ? gs.turnEndsAt : (ng && ng.endsAt)) : subEndsAt;
  const ms=Math.max(0, end-Date.now());
  const t=timerText(ms);
  if(el.textContent!==t) el.textContent=t;
  el.classList.toggle('timeup', ms<=0);
  el.classList.toggle('hurry', ms>0 && ms<=10000);
}

/* ---- ニゴアマリ メイン画面 ---- */
function ngWordsHtml(o){
  o=o||{};
  return `<div class="ng-words ${o.compact?'compact':''}">${ng.words.map((w,i)=>{
    const n=i+1;
    const cls=['ng-word']; if(o.clickable) cls.push('clickable'); if(o.answer===n) cls.push('answer');
    return `<div class="${cls.join(' ')}" data-idx="${i}"><span class="num">${n}</span><span class="w">${esc(w)}</span></div>`;
  }).join('')}</div>`;
}
function ngWordOf(n){ return ng.words[n-1]||''; }
function ngNumTag(n){ return `<span class="numtag">${n}</span><span class="numword">${esc(ngWordOf(n))}</span>`; }
function ngHeader(){
  const ids=ngIds();
  return `<div class="topbar">
    <span class="title">ニゴアマリ</span>
    <span class="chip">参加者 ${ids.length}人</span>
    ${ng.qNo?`<span class="chip">${ngQLabel()}</span>`:''}
    <span class="spacer"></span>
    ${ng.phase!=='lobby'?'<button class="small" data-act="qr">📱 QR表示</button>':''}

}
function ngPlayerChips(withKick){
  return `<div class="row" style="margin:8px 0 14px">${ngIds().map(p=>`<span class="chip"><span class="dot ${ngOnline(p)?'on':''}"></span>${esc(ngName(p))}
    <span class="muted">${ng.players[p].score}点</span>${withKick?`<button class="x" data-act="ng-kick" data-pid="${esc(p)}" title="参加者から外す">✕</button>`:''}</span>`).join('')}</div>`;
}
function ngStatusChips(map, label){
  const parts=Object.keys(ng.assign);
  const done=parts.filter(p=>map[p]!=null && map[p]!=='').length;
  return `<div class="row" style="margin:10px 0">
    <b>${label}：${done} / ${parts.length}人</b>

  </div>`;
}

        <div class="rv-cards">${rv.rows.map(r=>`<div class="rv-card ${r.correct?'correct':'wrong'}">
          <div class="rv-name">${esc(r.name)}</div>
          <div class="rv-hint">ヒント「${esc(r.hint)||'—'}」</div>
          <div class="rv-guess">${r.guess!=null?ngNumTag(r.guess):'<span class="muted">未回答</span>'}</div>
          ${r.correct?`<div class="rv-pt plus">⭕ 正解${rv.practice?'':` +${r.gain}点`}</div>`:''}</div>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:16px"><button class="primary big-btn" data-act="ng-rnext" data-enter>数字の割り振りを見る ▶</button></div>`;
    } else {
      // 誤答で書かれた数字の持ち主ごとにまとめる
      const byOwner={};
      rv.pens.forEach(x=>{ (byOwner[x.owner]=byOwner[x.owner]||[]).push(x); });
      const penHtml = Object.keys(byOwner).length
        ? Object.entries(byOwner).map(([o,list])=>`<div class="pen-item">
            <div class="pen-head">⚠ ${esc(ngName(o))}さん ペナルティ <b>-${list.length*rv.penaltyPts}点</b></div>
            <div>${list.map(x=>`${esc(ngName(x.from))}さんが ${ngNumTag(x.num)} と予想`).join('<br>')}</div>
            <div class="muted" style="font-size:14px">→ ${esc(ngName(o))}さんの数字だったため、書かれた回数 × ${rv.penaltyPts}点のペナルティ</div></div>`).join('')
        : '<div class="pen-none">誤答によるペナルティはありません</div>';
      panel=`<h2 class="rv-title">数字の割り振り</h2>
        ${rv.practice?'<div class="tie-note">例題のため、得点は合計に入りません（本番の第1問から加算されます）</div>':''}
        <div class="table-wrap"><table class="assign-table"><thead><tr><th>名前</th><th>割り振られた数字</th><th>予想</th><th>今回</th><th>合計</th></tr></thead><tbody>
          ${rv.rows.map(r=>{ const d=r.gain-r.loss; return `<tr class="${r.correct?'ok':''} ${r.loss?'pen':''}">
            <td><b>${esc(r.name)}</b></td>
            <td>${r.nums.map(ngNumTag).join('　')}</td>
            <td>${r.guess!=null?ngNumTag(r.guess):'—'}</td>
            <td class="${d>0?'plus':d<0?'minus':''}"><b>${r.gain&&r.loss?`+${r.gain} −${r.loss}`:d>0?`+${d}`:d<0?`−${-d}`:'0'}</b></td>
            <td>${ng.players[r.pid]?ng.players[r.pid].score:'—'}点</td></tr>`; }).join('')}
        </tbody></table></div>
        <div class="pen-box">${penHtml}</div>
        <div class="row" style="justify-content:center;margin-top:16px;gap:14px">
          ${rv.practice?'':'<button class="ghost" data-act="ng-final">ゲーム終了（最終結果発表へ）</button>'}
          <button class="primary big-btn" data-act="ng-nextq" data-enter>${rv.practice?'本番スタート（第1問へ）':'次の問題へ'} ▶</button></div>`;
    }
    body=`${panel}<div style="margin-top:18px">${ngWordsHtml({compact:true, answer: st>=1?ng.answer:null})}</div>`;
  }
  else if(ph==='final'){
    const fd=ng.finalData, st=ng.finalStep;
    const shownRanks=new Set(fd.steps.slice(0, st));
    const low=fd.list.filter(x=>x.rank>=4);
    const done=st>=fd.steps.length;
    const nextRank=fd.steps[st];
    const top=fd.list.filter(x=>x.rank<=3 && shownRanks.has(x.rank));
    const row=x=>`<div class="rank-row r${x.rank<=3?x.rank:'x'}"><span class="rk">${x.rank}位</span><span class="rn">${esc(x.name)}</span><span class="rs">${x.score}点</span></div>`;
    body=`<h2 class="rv-title" style="font-size:34px">🏆 最終結果発表</h2>
      ${done ? `<div class="answer-banner"><div class="lbl">優勝</div><div class="ans"><span class="answord">${fd.list.filter(x=>x.rank===1).map(x=>esc(x.name)).join('・')}</span></div><div class="sub">おめでとうございます！（全${ng.doneQ}問）</div></div>` : ''}
      ${!done && fd.topTie && st===0 ? '<div class="tie-note">⚠ 1位〜3位の中に同率の人がいます</div>' : ''}
      <div class="rank-list">
        ${!done ? `<div class="rank-row hidden"><span class="rk">${nextRank}位</span><span class="rn">？？？</span><span class="rs"></span></div>` : ''}
        ${top.map(row).join('')}
        ${low.length ? `<div class="rank-low">${low.map(row).join('')}</div>` : ''}
      </div>
      <div class="row" style="justify-content:center;margin-top:18px;gap:14px">
        ${!done ? `<button class="primary big-btn" data-act="ng-fnext" data-enter>${nextRank}位の発表 ▶</button>`
                : '<button class="primary big-btn" data-act="ng-again">🔁 もう一度遊ぶ</button><button data-act="toselect">🎮 ゲーム選択へ</button>'}
      </div>`;
  }
  app.innerHTML=`<div class="page">${ngHeader()}${body}</div>`;
  const qr=document.getElementById('qr');
  if(qr && myHostId) new QRCode(qr, {text:joinUrl(), width:260, height:260});
  if(ph!=='prep') document.querySelectorAll('#modal-root .swap-cand').forEach(el=>el.closest('.modal-bg').remove());
  tickTimer();
}

/** サブに送る画面情報（ニゴアマリ） */
function ngSnapshotFor(p){
  const inRound=!!ng.assign[p];
  const parts=Object.keys(ng.assign);
  const fd=ng.finalData;
  return {
    type:'state', game:'nigoamari', phase:ng.phase, name:ngName(p), score:ng.players[p].score,
    qNo:ng.qNo, qLabel:ngQLabel(), practice:ngIsPractice(), qId:ng.qId, total:ng.words.length, inRound, myNums: inRound ? ng.assign[p] : null,
    remainingMs: ['hint','predict'].includes(ng.phase) ? Math.max(0, ng.endsAt-Date.now()) : 0,
    myHint: ng.hints[p]||'', myGuess: ng.guesses[p]!=null ? ng.guesses[p] : null,
    hints: ng.phase==='predict' ? parts.map(q=>({id:q, name:ngName(q), hint:ng.hints[q]||'', me:q===p})) : null,
    revealStep: ng.revealStep,
    answer: ng.phase==='reveal' && ng.revealStep>=1 ? ng.answer : null,
    myRow: ng.phase==='reveal' && ng.rv ? (ng.rv.rows.find(r=>r.pid===p)||null) : null,
    final: ng.phase==='final' && fd ? { done: ng.finalStep>=fd.steps.length, me: fd.list.find(x=>x.pid===p)||null } : null
  };
}

   サブ（スマホ）
   ========================================================= */
let myPeer=null, myConn=null, myPid='', myName='', sub=null, removedByHost=false;
let lastSubEventId=null, lastViewKey='', pendingGuess=false;

function initSub(){
  requestWakeLock();
  myPid=sessionStorage.getItem(SS_PID) || uid();
  sessionStorage.setItem(SS_PID, myPid);
  myName=sessionStorage.getItem(SS_NAME) || '';
  renderConnecting();
  document.getElementById('app').addEventListener('click', onSubClick);
  document.getElementById('app').addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.isComposing && e.target.id==='ng-hint'){ e.preventDefault(); ngSendHint(); }
  });
  setInterval(tickTimer, 250);
  myPeer=new Peer();
  myPeer.on('open', ()=>connectToHost(params.get('room')));
  myPeer.on('disconnected', ()=>{ try{ myPeer.reconnect(); }catch(e){} });
  myPeer.on('error', err=>console.error(err));
}
function connectToHost(roomId){
  let timer=null;
  const retry=()=>{ if(removedByHost) return; clearTimeout(timer); timer=setTimeout(tryConnect, 3000); };
  function tryConnect(){
    if(removedByHost) return;
    try{
      const conn=myPeer.connect(roomId, {reliable:true});
      myConn=conn;
      conn.on('open', ()=>{ if(myName) sendJoin(); else renderNameForm(''); });
      conn.on('data', handleHostMessage);
      conn.on('close', ()=>{ if(myConn===conn){ renderConnecting(); retry(); } });
      conn.on('error', ()=>{ if(myConn===conn) retry(); });
      // 相手が見つからない時は open も close も来ないことがあるので、一定時間で再試行
      setTimeout(()=>{ if(myConn===conn && !conn.open){ try{ conn.close(); }catch(e){} retry(); } }, 8000);
    }catch(e){ retry(); }
  }
  tryConnect();
}
function sendHost(msg){ if(myConn && myConn.open){ try{ myConn.send(msg); return true; }catch(e){} } showToast('通信が切れています。再接続をお待ちください'); return false; }
function sendJoin(){ sendHost({type:'join', pid:myPid, name:myName}); }

function renderConnecting(){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
    <p>メイン画面に接続しています…</p><p class="muted" style="font-size:13px">つながらない場合はそのまま少しお待ちください（自動で再接続します）</p></div></div>`;
}
function renderNameForm(err){
  document.getElementById('app').innerHTML=`<div class="page"><div class="p-center">
    <h2>${esc(APP_TITLE)}</h2>
    <p>ニックネームを入力してください</p>
    ${err?`<p style="color:var(--danger)">${esc(err)}</p>`:''}
    <input type="text" id="nick" maxlength="12" placeholder="ニックネーム（12文字まで）" value="${esc(myName)}">
    <div style="margin-top:14px"><button class="primary" id="btn-join" style="width:100%;padding:14px;font-size:17px">参加する</button></div>
    <p class="muted" style="font-size:13px">途中で画面を閉じてしまった場合は、同じニックネームで入り直すと復帰できます</p>
  </div></div>`;
  document.getElementById('btn-join').onclick=()=>{
    const v=document.getElementById('nick').value.trim();
    if(!v){ alert('ニックネームを入力してください'); return; }
    myName=v; sessionStorage.setItem(SS_NAME, v);
    sendJoin();
  };
}
function handleHostMessage(data){
  if(!data) return;
  if(data.type==='state'){
    sub=data; pendingGuess=false;
    if(data.game==='nigoamari' || data.timerOn) subEndsAt=Date.now()+(data.remainingMs||0);
    renderSub();
  } else if(data.type==='wait'){
    sub=null; closeAllModals();
    document.title=APP_TITLE;
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><div class="spinner"></div>
      <h2>${esc(myName)}さん、ようこそ！</h2><p>メイン画面でゲームを選んでいます。<br>しばらくお待ちください。</p></div></div>`;
  } else if(data.type==='rejoin'){
    removedByHost=false; sendJoin();
  } else if(data.type==='name_taken'){
    myName=''; sessionStorage.removeItem(SS_NAME);
    renderNameForm('そのニックネームは使われています。別のニックネームにしてください');
  } else if(data.type==='full'){
    removedByHost=true;
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>満員です</h2><p>このゲームにはすでに2人が参加しています。</p></div></div>`;
  } else if(data.type==='removed'){
    removedByHost=true; sessionStorage.removeItem(SS_NAME); sessionStorage.removeItem(SS_PID);
    document.getElementById('app').innerHTML=`<div class="page"><div class="p-center"><h2>参加者から外れました</h2><p>もう一度参加する場合はQRコードを読み直してください。</p></div></div>`;
  }
}

function subHead(s){
  const info = (s.phase==='playing'||s.phase==='ended') ? `第${s.turn}/${s.maxTurn}ターン ・ 残りの緑 <b style="color:var(--accent)">${s.remaining}</b>` : '';
  return `<div class="sub-head"><div><span class="side-tag">サブ${s.side}</span> ${esc(s.name)}</div><div>${info}</div></div>`;
}
const NG_HTML = `<div class="ng"><b>※NGヒント</b><br>
  ・正解ワードそのまま<br>
  ・外来語にしただけ（例：みかんのヒントとしてオレンジ）<br>
  ・漢字の読み方を変えたもの（例：金のヒントとして、かね・きん）</div>`;

function renderSub(){
  const s=sub; if(!s) return;
  if(s.game==='nigoamari') return renderNgSub();
  const app=document.getElementById('app');
  document.title=s.title||GAME_TITLE;
  // フェーズ・ターン・役割が変わったら開いている確認ポップアップは閉じる
  const vk=`${s.phase}-${s.turn}-${s.role}`;
  if(vk!==lastViewKey){ closeAllModals(); lastViewKey=vk; }
  let html='';
  if(s.phase==='lobby' || s.phase==='prep'){
    html=`${subHead(s)}<div class="p-center">
      <h2>${esc(s.name)}さん、ようこそ！</h2>
      <p>あなたは <span class="side-tag">サブ${s.side}</span> です。</p>
      <p>${s.phase==='lobby' ? 'もう1人の参加を待っています…' : 'メイン画面でゲームの準備中です。<br>しばらくお待ちください。'}</p>
      <p class="muted" style="font-size:14px">相手：${s.partnerName?esc(s.partnerName)+(s.partnerConnected?'':'（切断中）'):'未参加'}</p>
    </div>`;
  }
  else if(s.phase==='keycheck'){
    html=`${subHead(s)}
      <div class="role-banner giver">あなたの色を確認してください</div>
      <div class="legend"><span><i style="background:var(--green)"></i>緑 9</span><span><i style="background:#000;border:1px solid #888"></i>黒 3</span><span><i style="background:#fff"></i>色なし 13</span></div>
      ${boardHtml(s.board, {key:s.key})}
      <div class="panel">この色はあなたにしか見えません。相手の画面とは色の配置が違います。<br>
        <b>緑</b>：相手に当ててほしい単語　<b>黒</b>：相手に選ばれるとゲームオーバー
        ${s.timerSec?`<br><b style="color:#ff9b9b">⏱ ハードモード：1ターン${s.timerSec}秒</b>（時間切れで自動的に次のターン）`:''}</div>
      <div class="bottom-btns">
        ${s.confirmed ? `<button disabled>確認済み ✓ ${s.partnerConfirmed?'':'（相手の確認待ち…）'}</button>`
                      : '<button class="primary" data-act="confirm">確認しました</button>'}
      </div>`;
  }
  else if(s.phase==='playing'){
    const giver=s.role==='giver';
    html=`${subHead(s)}
      <div class="role-row"><div class="role-banner ${s.role}">${giver?'あなたは【出題】です':'あなたは【解読】です'}</div>${s.timerOn?`<div class="wn-timer"><small>⏱ 残り</small><span id="ng-timer">${timerText(Math.max(0, subEndsAt-Date.now()))}</span></div>`:''}</div>
      ${boardHtml(s.board, {key:s.key, cleared:s.cleared, neutral:s.neutral, selectable: giver?null:s.selectable})}
      <div class="panel">${giver
        ? `相手に<b>「言葉1つ」</b>と<b>「当ててほしい枚数」</b>を伝えてください。${NG_HTML}`
        : `相手のヒントを聞いて、当てはまると思う単語をタップしてください。<br>
           <span class="muted">緑ならクリア（続けて選べます）／色なしは一般（ターン終了）／黒はゲームオーバー</span>`}</div>
      <div class="bottom-btns"><button data-act="next">次のターンへ ▶</button></div>`;
  }
  else if(s.phase==='ended'){
    const r=s.result||{};
    html=`${subHead(s)}
      ${r.type==='clear'
        ? `<div class="result-banner clear"><div class="big">🎉 ゲームクリア！</div><div>第${r.turn}ターンでクリア</div></div>`
        : `<div class="result-banner fail"><div class="big">ゲームオーバー</div><div>${r.reason==='black'?`黒（「${esc(r.word)}」）を選びました`:`${s.maxTurn}ターンが終了しました`}</div></div>`}
      ${boardHtml(s.board, {key:s.key, cleared:s.cleared, neutral:s.neutral})}
      <div class="panel">あなたの色を表示しています。<br>メイン画面で「もう一度遊ぶ」を押すと次のゲームが始まります。</div>`;
  }
  app.innerHTML=`<div class="page">${html}</div>`;
  // 進行イベント（最初の受信時は表示しない＝再接続時に古い通知を出さない）
  const ev=s.lastEvent;
  if(lastSubEventId===null){ lastSubEventId = ev ? ev.id : 0; }
  else if(ev && ev.id!==lastSubEventId){
    lastSubEventId=ev.id;
    showToast(ev.text, ev.type, 2600);
    if(s.phase==='playing' && (ev.type==='next'||ev.type==='neutral'||ev.type==='start'||(ev.type==='clear'&&/ターン$/.test(ev.text)))){
      setTimeout(()=>showToast(s.role==='giver'?'あなたは【出題】です':'あなたは【解読】です', s.role==='giver'?'clear':'next', 2400), 300);
    }
  }
}

/* 予想メモ（自分のスマホだけに保存。問題ごと） { 行のID: [番号...] } */
function ngMemoKey(){ return 'ngmemo_'+(sub&&sub.qId||''); }
function ngGetMemo(){ try{ return JSON.parse(sessionStorage.getItem(ngMemoKey())||'{}'); }catch(e){ return {}; } }
function ngSetMemo(m){ try{ sessionStorage.setItem(ngMemoKey(), JSON.stringify(m)); }catch(e){} }
function ngSendHint(){
  const el=document.getElementById('ng-hint'); if(!el) return;
  const v=el.value.trim();
  if(!v){ showToast('言葉を入力してください'); return; }
  if(sendHost({type:'ng_hint', text:v})) showToast('送信しました', 'clear', 1500);
}

  } else if(s.phase==='prep'){

    html=`<div class="p-center"><h2>この問題は観戦です</h2><p>次の問題から参加できます。</p>${see}</div>`;
  } else if(s.phase==='hint'){
    html=`${timer}
      <div class="panel" style="text-align:center">あなたの数字${numBoxes(s.myNums)}

      <div class="panel">
        <input type="text" id="ng-hint" data-keep maxlength="30" placeholder="共通する言葉" value="${esc(s.myHint)}">

      </div>`;
  } else if(s.phase==='predict'){

        ${s.hints.map(h=>`<div class="memo-row">
          <div class="memo-name">${esc(h.name)}${h.me?'（あなた）':''}　<b>「${esc(h.hint)||'—'}」</b></div>
          <div class="memo-chips">${all.map(n=>`<button class="memo-chip ${(memo[h.id]||[]).includes(n)?'on':''}" data-act="ng-memo" data-row="${esc(h.id)}" data-n="${n}">${n}</button>`).join('')}</div>
        </div>`).join('')}
      </div>
      <div class="panel">
        <div class="unchecked">チェックしていない数字：<b>${unchecked.length?unchecked.join('・'):'なし'}</b></div>
        <div style="margin-top:8px">余っている（誰も持っていない）数字を予想して送信</div>
        <div class="row" style="margin-top:8px;flex-wrap:nowrap">

          <button class="primary" data-act="ng-guess">解答送信</button>
        </div>

      </div>`;

    if(r && s.revealStep>=1) res = r.correct ? `<div class="result-banner clear"><div class="big">⭕ 正解！${s.practice?'':` +${r.gain}点`}</div></div>`
                                             : `<div class="result-banner fail"><div class="big">残念…</div><div>正解は ${s.answer}</div></div>`;
    if(r && s.revealStep>=2 && r.loss) res+=`<div class="note">⚠ あなたの数字が誤答で書かれたため ${s.practice?`ペナルティ（本番なら -${r.loss}点）`:`-${r.loss}点`}</div>`;
    if(s.practice && s.revealStep>=1) res+='<p class="muted">例題のため、得点は合計に入りません</p>';
    html=`<div class="p-center" style="padding-top:24px"><h2>結果発表</h2>
      ${r?`<p>あなたの予想：<b style="font-size:24px">${r.guess!=null?r.guess:'未回答'}</b></p>`:''}
      ${res}${s.revealStep>=2?`<p>現在の得点：<b style="font-size:22px">${s.score}点</b></p>`:''}${see}</div>`;
  } else if(s.phase==='final'){
    const f=s.final||{};
    html = f.done && f.me
      ? `<div class="p-center"><h2>最終結果</h2><div class="result-banner ${f.me.rank===1?'clear':''}" style="background:${f.me.rank===1?'':'var(--panel)'}"><div class="big">${f.me.rank}位</div><div>${f.me.score}点</div></div>${see}</div>`
      : `<div class="p-center"><h2>🏆 最終結果発表中…</h2>${see}</div>`;
  }
  app.innerHTML=`<div class="page">${head}${html}</div>`;
  Object.entries(keep).forEach(([id,v])=>{ const el=document.getElementById(id); if(el && v!=null && v!=='') el.value=v; });
  if(focusId){ const el=document.getElementById(focusId); if(el && el.focus){ el.focus(); if(el.setSelectionRange && typeof el.value==='string'){ try{ el.setSelectionRange(el.value.length, el.value.length); }catch(e){} } } }
}
function ngSubClick(b){
  const act=b.dataset.act;
  if(act==='ng-hint') ngSendHint();
  else if(act==='ng-memo'){
    const m=ngGetMemo(), row=b.dataset.row, n=Number(b.dataset.n);
    const a=m[row]||[];
    m[row]= a.includes(n) ? a.filter(x=>x!==n) : a.concat(n);
    ngSetMemo(m); renderNgSub();
  }
  else if(act==='ng-guess'){
    const v=Number(document.getElementById('ng-guess').value);
    if(!v){ showToast('番号を選んでください'); return; }
    if(sendHost({type:'ng_guess', num:v})) showToast(`${v} を送信しました`, 'clear', 1500);
  }
}

function onSubClick(e){
  const s=sub; if(!s) return;
  if(s.game==='nigoamari'){ const b=e.target.closest('[data-act]'); if(b) ngSubClick(b); return; }
  const cell=e.target.closest('.cell.tappable');
  if(cell && s.phase==='playing' && s.role==='guesser'){
    if(pendingGuess) return;
    const i=Number(cell.dataset.idx), w=s.board[i];
    openModal(`<h3 style="text-align:center">この単語でよろしいですか？</h3><div class="confirm-word">${esc(w)}</div>`, [
      {label:'やめる'},
      {label:'これにする', cls:'primary', onClick:()=>{ if(sendHost({type:'guess', idx:i})) pendingGuess=true; }}
    ]);
    return;
  }
  const b=e.target.closest('[data-act]');
  if(!b) return;
  if(b.dataset.act==='confirm'){ sendHost({type:'confirm'}); }
  else if(b.dataset.act==='next'){
    const last = s.turn>=s.maxTurn;
    openModal(`<h3>次のターンへ進みますか？</h3>
      <p>${last?'<b style="color:#c0392b">最終ターンです。次へ進むとゲームオーバーになります。</b>':'出題と解読が交代します。'}</p>
      <p style="font-size:13px;color:#666">※どちらか1人が押せば進みます</p>`, [
      {label:'キャンセル'},
      {label:last?'終了する':'次のターンへ', cls:last?'danger':'primary', onClick:()=>{ sendHost({type:'next_turn', turn:s.turn}); }}
    ]);
  }
}

/* =========================================================
   管理ページ
   ========================================================= */
function initAdmin(){
  document.getElementById('app').addEventListener('click', onAdminClick);
  renderAdmin();
  // メイン画面（別タブ）でゲームが進んだら自動で最新の状態に更新する
  const refresh=()=>{
    const keep=['ex-input','words-input','set-time','set-ptime','set-correct','set-penalty'].map(id=>{ const el=document.getElementById(id); return [id, el?el.value:'']; });
    renderAdmin();
    keep.forEach(([id,v])=>{ const el=document.getElementById(id); if(el) el.value=v; });
  };
  window.addEventListener('storage', e=>{ if(!e.key || [LS.used,LS.excluded,LS.history,LS.words,LS.settings].includes(e.key)) refresh(); });
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') refresh(); });
}
function renderAdmin(){
  const words=getWordList(), used=getUsed(), ex=getExcluded(), allHist=getHistory().slice().reverse();
  const hist=allHist.filter(h=>h.game!=='nigoamari');           // game が無い古い記録はワードネーム扱い
  const ngHist=allHist.filter(h=>h.game==='nigoamari');
  const st=ngSettings();
  const usedCnt=words.filter(w=>used.has(w) && !ex.has(w)).length;
  const exCnt=words.filter(w=>ex.has(w)).length;
  const remain=words.length-usedCnt-exCnt;
  const custom=Array.isArray(lsGet(LS.words,null));
  const clears=hist.filter(h=>h.result==='clear').length;
  document.title=APP_TITLE+' 管理ページ';
  document.getElementById('app').innerHTML=`<div class="page">
    <div class="topbar"><span class="title">${esc(APP_TITLE)} 管理ページ</span><span class="spacer"></span>
      <button class="primary" data-act="tohost">▶ メイン画面へ</button></div>

    <div class="card">
      <h2>ニゴアマリ 履歴</h2>
      <p class="muted" style="margin-top:-6px">全${ngHist.length}回</p>
      ${ngHist.length ? `<div class="table-wrap"><table><thead><tr><th>遊んだ日時</th><th>問題数</th><th>優勝者</th><th>参加者</th><th></th></tr></thead><tbody>
        ${ngHist.map(h=>`<tr>
          <td>${fmtDate(h.at)}</td>
          <td>${h.questions}問</td>
          <td><b>${esc((h.winners||[]).join('・'))}</b></td>
          <td>${esc(h.players||'')}</td>
          <td><button class="small ghost" data-act="delhist" data-id="${esc(h.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="small danger" data-act="clearhist" data-game="nigoamari">ニゴアマリの履歴をすべて削除</button></div>`
      : '<p class="muted">まだ記録がありません。</p>'}
    </div>

    <div class="card">
      <h2>ニゴアマリ 設定</h2>
      <div class="settings-grid">
        <label>ヒント入力の制限時間（秒）<input type="number" id="set-time" min="5" max="999" value="${st.time}"></label>
        <label>予想フェイズの制限時間（秒）<input type="number" id="set-ptime" min="5" max="999" value="${st.predictTime}"></label>
        <label>正解の得点（＋）<input type="number" id="set-correct" min="0" max="999" value="${st.correct}"></label>
        <label>ペナルティ（書かれるごとに −）<input type="number" id="set-penalty" min="0" max="999" value="${st.penalty}"></label>
      </div>
      <label class="chk" style="font-size:16px;margin:4px 0 10px"><input type="checkbox" id="set-practice" ${st.practiceFirst?'checked':''}>
        <span><b>1問目を例題にする</b><br><small class="muted">例題の得点は最終結果に入りません。例題は問題数にも数えず、2問目を「第1問」と表示します。</small></span></label>
      <p class="muted" style="font-size:14px">どちらのフェイズも、時間が過ぎても解答は送れます。</p>
      <button class="primary" data-act="savesettings">設定を保存</button>
    </div>

    <div class="card">
      <h2>ワードネーム クリア履歴</h2>
      <p class="muted" style="margin-top:-6px">全${hist.length}回 ／ クリア ${clears}回 ／ 失敗 ${hist.length-clears}回</p>
      ${hist.length ? `<div class="table-wrap"><table><thead><tr><th>遊んだ日時</th><th>結果</th><th>ターン</th><th>クリア時間</th><th>制限時間</th><th>見つけた緑</th><th>参加者</th><th></th></tr></thead><tbody>
        ${hist.map(h=>`<tr>
          <td>${fmtDate(h.at)}</td>
          <td><span class="tag ${h.result}">${h.result==='clear'?'クリア':'失敗'}</span></td>
          <td>第${h.turn}ターン</td>
          <td>${h.result==='clear' && h.clearMs!=null ? fmtDuration(h.clearMs) : '—'}</td>
          <td>${h.timerSec ? '⏱ '+h.timerSec+'秒' : 'なし'}</td>
          <td>${h.found!=null?h.found+' / 15':'—'}</td>
          <td>${esc(h.players||'')}</td>
          <td><button class="small ghost" data-act="delhist" data-id="${esc(h.id)}">削除</button></td></tr>`).join('')}
      </tbody></table></div>
      <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="small danger" data-act="clearhist" data-game="wordname">ワードネームの履歴をすべて削除</button></div>`
      : '<p class="muted">まだ記録がありません。</p>'}
    </div>

    <div class="card">
      <h2>除外単語リスト（${exCnt}語）</h2>
      <p class="muted" style="margin-top:-6px">ここにある単語はゲームで選ばれません。「解除」で再び選ばれるようになります。</p>
      <div class="row" style="margin-bottom:12px">
        <input type="text" id="ex-input" placeholder="除外したい単語を入力" style="max-width:320px">
        <button data-act="addex">除外に追加</button>
      </div>
      ${ex.size ? `<div class="ex-list">${[...ex].map(w=>`<span class="ex-item">${esc(w)}<button class="small ghost" data-act="unex" data-w="${esc(w)}">解除</button></span>`).join('')}</div>`
                : '<p class="muted">除外している単語はありません。</p>'}
    </div>

    <div class="card">
      <h2>単語の使用状況</h2>
      <div class="stats4">
        <div class="stat"><div class="lbl">単語リスト</div><div class="val">${words.length}</div></div>
        <div class="stat"><div class="lbl">使用済み</div><div class="val">${usedCnt}</div></div>
        <div class="stat"><div class="lbl">未使用</div><div class="val" style="color:var(--accent)">${remain}</div></div>
        <div class="stat"><div class="lbl">除外</div><div class="val">${exCnt}</div></div>
      </div>
      <p class="muted">一度選ばれた単語は、すべての単語が一度ずつ使われるまで選ばれません（ワードネームとニゴアマリで共通。ワードネームなら約${Math.floor(remain/25)}ゲーム分）。<br>
        未使用が足りなくなると、単語を選ぶ時にリセットするか確認します。</p>
      <button class="danger" data-act="resetused">使用状況をリセット</button>
    </div>

    <div class="card">
      <h2>単語リスト</h2>
      <p class="muted" style="margin-top:-6px">現在：${custom?'貼り付けたリスト':'初期リスト（スプレッドシート「単語リスト」A1〜A1850）'}　${words.length}語</p>
      <p style="font-size:14px">スプレッドシートの単語を更新した時は、A列をコピーして下に貼り付け（1行1単語）→「このリストに置き換える」を押してください。</p>
      <textarea id="words-input" rows="6" placeholder="1行に1単語"></textarea>
      <div class="row" style="margin-top:10px">
        <button data-act="setwords">このリストに置き換える</button>
        ${custom?'<button class="ghost" data-act="defwords">初期リストに戻す</button>':''}
      </div>
    </div>

    <div class="card">
      <h2>データの引き継ぎ</h2>
      <p class="muted" style="margin-top:-6px">履歴・除外単語・使用状況・単語リストをJSONファイルで書き出し／読み込みできます（別のPCへの引き継ぎやバックアップ用）。</p>
      <div class="row">
        <button data-act="export">⬇ JSON書き出し</button>
        <button data-act="import">⬆ JSON読み込み</button>
        <input type="file" id="import-file" accept=".json,application/json" style="display:none">
      </div>
    </div>
  </div>`;
  document.getElementById('import-file').onchange=onImportFile;
}
/** 削除した履歴の回で使った単語を「未使用」に戻す（単語を記録していない古い履歴は何もしない） */
function unuseWords(entries){
  const used=getUsed();
  entries.forEach(h=>(h.words||[]).forEach(w=>used.delete(w)));
  setUsed(used);
}
function onAdminClick(e){
  const b=e.target.closest('[data-act]'); if(!b) return;
  const act=b.dataset.act;
  if(act==='tohost') location.href=location.pathname;
  else if(act==='delhist'){
    if(!confirm('この履歴を削除しますか？\n（この回で使った単語は「未使用」に戻ります）')) return;
    const all=getHistory();
    unuseWords(all.filter(h=>h.id===b.dataset.id));
    setHistory(all.filter(h=>h.id!==b.dataset.id)); renderAdmin();
  }
  else if(act==='clearhist'){
    const g=b.dataset.game, isNg=h=>h.game==='nigoamari';
    const match=h=> g==='nigoamari' ? isNg(h) : !isNg(h);
    if(!confirm(`${GAMES[g].title}の履歴をすべて削除しますか？（元に戻せません）\n（履歴に残っている回で使った単語は「未使用」に戻ります）`)) return;
    const all=getHistory();
    unuseWords(all.filter(match));
    setHistory(all.filter(h=>!match(h))); renderAdmin();
  }
  else if(act==='savesettings'){
    const num=id=>Math.max(0, Math.round(Number(document.getElementById(id).value)||0));
    const s={time:Math.max(5, num('set-time')), predictTime:Math.max(5, num('set-ptime')), correct:num('set-correct'), penalty:num('set-penalty'),
             practiceFirst:document.getElementById('set-practice').checked};
    lsSet(LS.settings, Object.assign(lsGet(LS.settings,{})||{}, s)); renderAdmin(); showToast('設定を保存しました', 'clear');
  }
  else if(act==='unex'){ const s=getExcluded(); s.delete(b.dataset.w); setExcluded(s); renderAdmin(); }
  else if(act==='addex'){
    const v=document.getElementById('ex-input').value.trim(); if(!v) return;
    if(!getWordList().includes(v) && !confirm(`「${v}」は単語リストにありません。除外リストに追加しますか？`)) return;
    const s=getExcluded(); s.add(v); setExcluded(s); renderAdmin();
  }
  else if(act==='resetused'){ if(!confirm('単語の使用状況をリセットしますか？\n（すべての単語がまた選ばれるようになります。除外単語はそのままです）')) return; setUsed(new Set()); renderAdmin(); }
  else if(act==='setwords'){
    const list=[...new Set(document.getElementById('words-input').value.split(/\r?\n/).map(s=>s.split('\t')[0].trim()).filter(Boolean))];
    if(list.length<25){ alert('単語が25個未満です'); return; }
    if(!confirm(`${list.length}語のリストに置き換えますか？`)) return;
    lsSet(LS.words, list); renderAdmin();
  }
  else if(act==='defwords'){ if(!confirm('初期リスト（1850語）に戻しますか？')) return; localStorage.removeItem(LS.words); renderAdmin(); }
  else if(act==='export'){
    const data={app:'wname', version:1, exportedAt:new Date().toISOString(),
      words:lsGet(LS.words,null), used:lsGet(LS.used,[]), excluded:lsGet(LS.excluded,[]), history:lsGet(LS.history,[]), settings:lsGet(LS.settings,null)};
    const blob=new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    const d=new Date(); a.download=`wordname_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
    a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
  }
  else if(act==='import') document.getElementById('import-file').click();
}
function onImportFile(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(d.app!=='wname' && d.app!=='wduo') throw new Error('format');
      if(!confirm('読み込んだデータで、今のデータ（履歴・除外単語・使用状況・単語リスト）を上書きしますか？')) return;
      if(Array.isArray(d.words)&&d.words.length) lsSet(LS.words, d.words); else localStorage.removeItem(LS.words);
      lsSet(LS.used, Array.isArray(d.used)?d.used:[]);
      lsSet(LS.excluded, Array.isArray(d.excluded)?d.excluded:[]);
      lsSet(LS.history, Array.isArray(d.history)?d.history:[]);
      if(d.settings && typeof d.settings==='object') lsSet(LS.settings, d.settings);
      alert('読み込みました'); renderAdmin();
    }catch(err){ alert('このファイルは読み込めませんでした'); }
  };
  rd.readAsText(f);
  e.target.value='';
}

/* ---------- 起動 ---------- */
if(MODE==='admin') initAdmin();
else if(MODE==='sub') initSub();
else initHost();
</script>
